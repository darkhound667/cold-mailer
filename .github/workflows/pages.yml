# Deploys the locked dashboard page. Only needed when site/index.html changes: the page reads the
# latest encrypted data (site/data.enc.json, committed by the runner) straight from the repo.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/index.html"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
