# Phase 4: the unattended sender. Each run is long-lived (up to ~5 h 40 min): it sends due emails
# at their exact minute (one per minute), polls replies every minute, commits state + the encrypted
# dashboard data, and then starts its own successor. GitHub throttles cron on quiet repos, so the
# 10-minute schedule below is only a backup restart. One run at a time (concurrency group).
name: tick

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      dry_run_to:
        description: "Phase 5 dry run: send every due email to this address instead"
        required: false
        default: ""

permissions:
  contents: write     # commit state after each send
  issues: write       # reply / needs-ruturva issues
  actions: write      # gap check (previous run time) + dispatching the successor run

concurrency:
  group: sender
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet cryptography holidays
      - name: Git identity for state commits
        run: |
          git config user.name "cold-mailer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Tick
        id: tick
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_TOKEN: ${{ secrets.SENDER_APP_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          DRY_RUN_TO: ${{ inputs.dry_run_to }}
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
          GIT_PUSH: "1"
          CHAIN: "1"
        run: python src/runner/tick.py
